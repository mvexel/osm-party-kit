# osmlogo v0 noun dictionary — compiled to cosmo tables.
# Each table = one NOUN. Tag bundles are first-pass editorial decisions; audit against taginfo.

tables:
  parks:
    filter: "leisure=park|garden|dog_park | landuse=recreation_ground"
    geometry:
      node: false
      way: false
      closed_way: polygon
      relation: true
    columns:
      - name: name
        source: tag:name
      - name: osm_id
        source: meta:id
        type: integer
      - name: osm_type
        source: meta:type
      - name: timestamp
        source: meta:timestamp

  playgrounds:
    filter: "leisure=playground"
    geometry:
      node: true
      way: false
